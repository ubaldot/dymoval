# CI/CD pipeline
name: pipeline for latest and greatest packages

on:
  push:
  pull_request:
    branches:
    - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Static checks. Ruff is platform- and interpreter-independent, so there is
  # no point in running it once per matrix entry: it runs once, here, with a
  # pinned version so that a new ruff release cannot break the pipeline on an
  # unrelated commit.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Formatting (ruff format)
        uses: astral-sh/ruff-action@v4.1.0
        with:
            version: "0.15.2"
            args: "format --check"
            src: "."

      - name: Linting (ruff check)
        uses: astral-sh/ruff-action@v4.1.0
        with:
            version: "0.15.2"
            args: "check"
            src: "./src ./tests"

  # Tests on all platforms
  # Here we use a freeze file so we are 100% sure that if there is any failure
  # is because of dymoval itself and not because of some weird dependency
  # stuff
  # We test by downloading ALL the dependencies, including the dev ones.
  pip_tests_dev:
    name: Pip install (dev)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.2.0
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install dependencies dev (pip)
        run: |
          python -m pip install ".[dev]"

      - name: Run tests (mypy, pytest, sphinx)
        run: |
          mypy ./src
          coverage run -m pytest ./tests/ -m "not open_tutorial"
          cd docs
          make clean
          make html
          cd ..

      - name: Build wheel and sdist
        run: |
          python -m build

  pip_tests_user:
    # The purpose is to check if it is OK to release on pypi, i.e. if the user
    # can use it with the default packages without the need of installing dev
    # packages.
    # If it passes, then it is OK for release.
    # Conda releases must be done manually anyways.
    name: Pip install (user)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.2.0
        with:
            python-version: ${{ matrix.python-version }}

      - name: Install dependencies user (pip)
        run: |
          python -m pip install .

      - name: Run tests (mypy, pytest, sphinx)
        run: |
          python -m pip install pytest
          python -m pip install coverage
          coverage run -m pytest ./tests/ -m "not open_tutorial"

  conda_tests_dev:
    # In environment.yml no version is specified whereas in
    # environment_locked.yml the version is specified.
    # We test by downloading ALL the dependencies, including the dev ones.
    name: Conda install (dev)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
    # dependabot/github_actions/conda-incubator/setup-miniconda-3
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3

        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: true
          # environment.yml has no version specified so it will pick the last
          # one.
          environment-file: ./environment.yml
          miniforge-version: latest

      - name: (bash) Install dymoval through pip (unfortunately)
        shell: bash -l {0}
        run: |
          python -m pip install .

      - name: (bash) Run all the tests on bash (mypy, pytest, sphinx)
        shell: bash -l {0}
        run: |
          mypy ./src
          coverage run -m pytest ./tests/ -m "not open_tutorial"
          cd docs
          make clean
          make html

      - name: (powershell) Install dymoval through pip (unfortunately)
        shell: pwsh
        run: |
          python -m pip install .

      - name: (powershell) Run all the tests on Powershell (mypy, pytest, sphinx)
        shell: pwsh
        run: |
          mypy ./src
          coverage run -m pytest ./tests/ -m "not open_tutorial"
          cd docs
          make clean
          make html

    # TODO conda user test: build the .bz2, install it through conda and run
    # pytest

  docs:
    # Build doc and push to gh-pages
    name: Docs
    runs-on: ubuntu-latest
    # This job force-pushes to gh-pages and commits coverage.svg back to the
    # branch, so it must only run for main. Without this guard every feature
    # branch would overwrite the published documentation.
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5.2.0
        with:
            python-version: '3.14'


      - name: Build docs (sphinx)
        run: |
          python -m pip install ".[dev]"
          cd docs
          make clean
          make html
          cd ..

      - name: Init new repo in dist folder and commit generated files
        run: |
          cd docs/build/html/
          git init
          touch .nojekyll
          git add -A
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "deploy"

      - name: Force push to destination branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          branch: gh-pages
          force: true
          directory: ./docs/build/html

      - name: Run test for generating .coverage file
        run: |
          coverage run --source=dymoval --branch -m pytest -m "not open_tutorial"
          coverage report -m

      - name: Coverage Badge
        uses: tj-actions/coverage-badge-py@v2

      - name: Verify Changed files
        uses: tj-actions/verify-changed-files@v20
        id: changed_files
        with:
          files: coverage.svg

      - name: Commit files
        if: steps.changed_files.outputs.files_changed == 'true'
        run: |
          rm .coverage
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add coverage.svg
          git commit -m "Updated coverage.svg"

      - name: Push changes
        if: steps.changed_files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.github_token }}
          branch: ${{ github.ref }}
