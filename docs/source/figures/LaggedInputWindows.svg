<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
  <title id="title">Full log, assessment segment, and overlapping input stacks</title>
  <desc id="description">Example with N equals 100 samples, W equals 50 samples, and L equals 20 samples. The assessment segment covers zero-based samples 20 through 69. Its first stack covers samples 20 through 39, the next covers 21 through 40, and the last covers 50 through 69. There are 31 overlapping stacks in this segment.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#172b4d">
    <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold">One log, one assessment segment, many overlapping stacks</text>
    <text x="480" y="57" text-anchor="middle">Example: N = 100, W = 50, L = 20 (all lengths in samples)</text>

    <path d="M80,90 H880" stroke="#334155" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="480" y="83" text-anchor="middle">Full log: N samples</text>
    <rect x="80" y="104" width="800" height="34" rx="3" fill="#e2e8f0" stroke="#64748b"/>
    <rect x="240" y="104" width="400" height="34" fill="#cce9f5" stroke="#0077a8" stroke-width="2"/>
    <text x="80" y="159">0</text>
    <text x="880" y="159" text-anchor="end">99 = N - 1</text>
    <text x="80" y="181" font-size="14">Zero-based sample indices; time increases to the right</text>

    <path d="M240,145 V365 M640,145 V365" stroke="#0077a8" stroke-dasharray="4 4"/>
    <text x="440" y="209" text-anchor="middle" font-weight="bold">Assessment segment: W = 50 samples</text>
    <text x="240" y="230">20 = x</text>
    <text x="640" y="230" text-anchor="end">69 = x + W - 1</text>

    <rect x="240" y="247" width="160" height="27" rx="3" fill="#ffdfaa" stroke="#996000"/>
    <text x="320" y="266" text-anchor="middle">L = 20</text>
    <text x="660" y="266">First stack: samples 20-39</text>

    <rect x="248" y="286" width="160" height="27" rx="3" fill="#ffdfaa" stroke="#996000"/>
    <text x="328" y="305" text-anchor="middle">L = 20</text>
    <text x="660" y="305">Next stack: samples 21-40</text>

    <text x="440" y="334" text-anchor="middle">... shift one sample at a time ...</text>

    <rect x="480" y="345" width="160" height="27" rx="3" fill="#ffdfaa" stroke="#996000"/>
    <text x="560" y="364" text-anchor="middle">L = 20</text>
    <text x="660" y="364">Last stack: samples 50-69</text>

    <text x="480" y="406" text-anchor="middle" font-weight="bold">W - L + 1 = 31 stacks contribute to one Gram matrix and one score.</text>
    <text x="480" y="430" text-anchor="middle" font-size="14">Move the W-sample segment along the log to calculate scores for other portions.</text>
  </g>
</svg>
