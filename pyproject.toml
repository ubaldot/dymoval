[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dymoval_tutorial = ["*.ipynb"]

[project]
# General info
name = "dymoval"
version = "1.0.0"

# Requirements
requires-python = ">=3.12"

# Dependencies
dependencies = [
    "matplotlib",
    "scipy",
    "control",
    "numpy",
    "h5py",
]

# Other metadata
authors = [
{ name="Ubaldo Tiberi", email="ubaldo.tiberi@gmail.com" },
{ name="Ubaldo Tiberi", email="ubaldo.tiberi@volvo.com" },
]
description = "Dymoval is a Python package for analyzing measurements data and validate models."
readme = "README.md"
license = { file="LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
keywords = [
    "data-analysis",
    "modeling",
    "model validation",
    "dataset",
    "data"
]
# dynamic = ["version"] This may be useful once I will learn how to deal with versions

# For developers
[project.optional-dependencies]
dev = [
    "sphinx",
    "furo",
    "sphinx-autodoc-typehints",
    "pytest",
    "mypy",
    "ruff",
    "coverage",
    "grayskull",
    "build",
    "twine"
]

[project.urls]
"Homepage" = "https://github.com/ubaldot/dymoval"
"Documentation" = "https://ubaldot.github.io/dymoval/"
"Bug Tracker" = "https://github.com/ubaldot/dymoval/issues"

# ===================================
# Formatting, type check, unit-test
# ===================================
# run:
#   ruff format ./src
#   ruff check . --fix-only
[tool.ruff]
target-version = "py312"
line-length = 79
exclude = [
    "manual_tests",
    "docs",
    "src/dymoval_tutorial",
    ".*",
    # ruff only formats Python; keep it that way even if a future
    # release grows support for other file types.
    "*.md",
    "*.ipynb",
]

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # isort
    "I",
]
ignore = ["F403","F405", "E501", "W291", "E203"]
# mypy
# run:
# . mypy ./src
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
# For now, mypy is only run on ./src
# The following two shall be module specific
ignore_missing_imports = true
# disable_error_code = ["name-defined"]

[[tool.mypy.overrides]]
module = [
    "dataset",
    "validation",
    "utils",
    "config",
]


# pytest
# Run
#  pytest -m "not (plots or open_tutorial)"
[tool.pytest.ini_options]
norecursedirs = ["manual_tests"] # Exclude folders
markers = [
    "plots: marks SLOW plot tests (deselect with '-m \"not plots\"')",
    "open_tutorial: marks the open_tutorial (which opens VSCode all the times)"

]
